{% if works %}
	<ul class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
		{% for work in works %}
			<li>
				<div class="group block">
					{% if work.thumbnail %}
						<button
							type="button"
							class="work-gallery-image__trigger"
							data-lightbox-trigger
							data-lightbox-url="{{ work.thumbnail.image.url }}"
							data-lightbox-alt="{{ work.title }}"
						>
							<img
								src="{{ work.thumbnail.image.url }}"
								alt="{{ work.title }}"
								class="h-56 w-full rounded-sm border border-gold/40 object-cover"
							/>
						</button>
					{% endif %}
				</div>
			</li>
		{% endfor %}
	</ul>
{% else %}
	<p class="font-body text-sm text-base-content/75">
		{{ empty_message }}
	</p>
{% endif %}
