[project]
name = "swamp"
version = "0.1.0"
description = "Swamp Monster Leather marketing site"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<5.3",
    "psycopg[binary]>=3.2",
    "django-environ>=0.11",
    "django-anymail>=11.1",
    "whitenoise>=6.7",
    "gunicorn>=23.0",
    "django-admin-sortable2>=2.3.1",
    "django-markdownify>=0.9.7",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "django-stubs[compatible-mypy]>=5.1",
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-django>=4.9",
    "playwright>=1.48",
    "pytest-playwright>=0.5",
    "factory-boy>=3.3.3",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "swamp.settings"
python_files = ["test_*.py", "*_test.py", "tests.py"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
python_version = "3.13"
mypy_path = "."
exclude = ["staticfiles/", "static/"]

[tool.django-stubs]
django_settings_module = "swamp.settings"

[[tool.mypy.overrides]]
module = "environ.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "adminsortable2.*"
ignore_missing_imports = true

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["staticfiles", "static", "*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swamp"]
