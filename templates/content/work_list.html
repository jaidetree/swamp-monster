{% extends "base.html" %}

{% block title %}Works — Swamp Monster Leather{% endblock %}

{% block content %}
<h1>Works</h1>
<ul class="works-list">
	{% for work in works %}
	<li class="work-card">
		<a href="{% url 'content:work_detail' work.slug %}">
			{% if work.thumbnail %}
			<img src="{{ work.thumbnail.image.url }}" alt="{{ work.title }}">
			{% endif %}
			<span>{{ work.title }}</span>
		</a>
	</li>
	{% empty %}
	<li>No works published yet.</li>
	{% endfor %}
</ul>
{% endblock %}
