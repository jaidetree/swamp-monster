# Production Fly app (ticket 18 cutover) — the existing live app that
# previously served the placeholder. Real production DNS/certs already
# point here; deploying this file swaps it from the placeholder to Django
# via Fly's blue-green release, with no DNS change.
#
# During the port (ticket 10 through 17), this file targeted the temporary
# staging app `swamp-monster-leather-staging`, which is destroyed as part
# of this cutover (see CUTOVER-RUNBOOK.md). If a rollback is ever needed,
# redeploy `placeholder/fly.toml` to this same app name instead of editing
# this file.
app = "swamp-monster-leather"
primary_region = "ewr"

[build]

[deploy]
  release_command = "/app/manage.py migrate --noinput"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]
